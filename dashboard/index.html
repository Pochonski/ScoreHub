    <!--
      Auditoría 2026-Q3 Fase 7.1 — Content Security Policy.
      - 'self' para assets locales
      - Tailwind 4 genera estilos inline → style-src incluye 'unsafe-inline' (transitorio)
      - data: para imágenes base64 (badges, flags)
      - imagecache.365scores.com para thumbnails de upstream
      - jsdelivr/unpkg NO permitidos (deps empaquetadas vía vite)
      - frame-ancestors 'none' anti-clickjacking
      Ajustar según necesidad (e.g. agregar dominio analytics si se usa).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://imagecache.365scores.com data:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://jcfulxsqayscvqgxemhv.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
    <meta name="theme-color" content="#070B15" />
